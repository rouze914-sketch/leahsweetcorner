
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Leah's Sweet Corner | Postres y pedidos</title>

    <style>
        :root {
            --bg-color: #f0fdf4;
            --card-bg: #ffffff;
            --text-color: #065f46;
            --text-muted: #047857;
            --accent-color: #ec4899;
            --accent-hover: #db2777;
            --tag-bg: #fbcfe8;
        }

        * {
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            padding-bottom: 100px;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
        }

        h1 {
            font-size: 2.3rem;
            margin-bottom: 5px;
            color: var(--text-color);
        }

        .subtitle {
            color: var(--text-muted);
            font-size: 1.1rem;
        }

        .section-title {
            text-align: center;
            margin: 30px 0 20px;
        }

        .catalog {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
            max-width: 1100px;
            margin: 0 auto 40px;
        }

        .product-card {
            background-color: var(--card-bg);
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 10px 25px rgba(236, 72, 153, 0.1);
            text-align: center;
            border: 1px solid #bbf7d0;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .product-img {
            width: 100%;
            height: 210px;
            object-fit: cover;
            display: block;
            background-color: #fff7fb;
        }

        .product-info {
            padding: 15px;
        }

        .product-name {
            font-size: 1.1rem;
            font-weight: bold;
            margin-bottom: 8px;
        }

        .product-desc {
            font-size: 0.9rem;
            color: #6b7280;
            margin-bottom: 10px;
        }

        .product-price {
            color: var(--accent-color);
            font-size: 1.2rem;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .counter {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px;
            padding: 0 15px 18px;
        }

        .counter button {
            background-color: var(--tag-bg);
            color: var(--accent-color);
            border: none;
            width: 35px;
            height: 35px;
            border-radius: 50%;
            font-size: 1.2rem;
            font-weight: bold;
            cursor: pointer;
        }

        .counter button:hover {
            background-color: var(--accent-color);
            color: white;
        }

        .quantity {
            font-size: 1.1rem;
            font-weight: bold;
            min-width: 20px;
        }

        .cart-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background-color: white;
            box-shadow: 0 -5px 20px rgba(0, 0, 0, 0.1);
            padding: 12px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            border-top: 2px solid #bbf7d0;
            z-index: 100;
        }

        .cart-total {
            font-size: 1.1rem;
            font-weight: bold;
            color: var(--text-color);
        }

        .whatsapp-btn {
            background-color: #25d366;
            color: white;
            padding: 12px 18px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: bold;
            text-align: center;
        }

        .whatsapp-btn:hover {
            background-color: #20ba5a;
        }

        @media (max-width: 480px) {
            body {
                padding: 12px;
                padding-bottom: 100px;
            }

            h1 {
                font-size: 1.8rem;
            }

            .catalog {
                grid-template-columns: repeat(2, minmax(0, 1fr));
                gap: 12px;
            }

            .product-img {
                height: 145px;
            }

            .product-info {
                padding: 10px;
            }

            .product-name {
                font-size: 1rem;
            }

            .cart-bar {
                padding: 10px;
            }

            .cart-total {
                font-size: 0.95rem;
            }

            .whatsapp-btn {
                padding: 10px;
                font-size: 0.85rem;
            }
        }
    </style>
</head>

<body>

    <header>
        <h1>Leah's Sweet Corner 🍰</h1>
        <div class="subtitle">
            ¡Postres hechos con amor! Elige tus favoritos y haz tu pedido.
        </div>
    </header>

    <h2 class="section-title">🍋 Carlota en vaso</h2>
    <div class="catalog" id="carlotaCatalog"></div>

    <h2 class="section-title">🍰 Cheesecakes</h2>
    <div class="catalog" id="cheesecakeCatalog"></div>

    <div class="cart-bar">
        <div class="cart-total" id="cartTotal">Total: RD$0</div>
        <a id="whatsappLink"
           href="#"
           target="_blank"
           rel="noopener noreferrer"
           class="whatsapp-btn">
            Pedir por WhatsApp 📱
        </a>
    </div>

    <script>
        const products = 
            // CARLOTAS PEQUEÑAS: RD$100
            {
                id: 1,
                category: "carlota",
                name: "Carlota de Fresa",
                desc: "Vaso pequeño",
                price: 100,
                img: "Carlota_Vaso_Pequeno_Fresa[1].jpg",
                qty: 0
            },
            {
                id: 2,
                category: "carlota",
                name: "Carlota de Chinola",
                desc: "Vaso pequeño",
                price: 100,
                img: "Carlota_Vaso_Pequeno_Chinola[1].jpg",
                qty: 0
            },
            {
                id: 3,
                category: "carlota",
                name: "Carlota de Limón",
                desc: "Vaso pequeño",
                price: 100,
                img: "Carlota_Vaso_Pequeno_Limon[1].jpg",
                qty: 0
            },
            {
                id: 4,
                category: "carlota",
                name: "Carlota de Oreo",
                desc: "Vaso pequeño",
                price: 100,
                img: "Carlota_Vaso_Pequeno_Oreo[1].jpg",
                qty: 0
            },

            // CARLOTAS GRANDES: RD$175
            {
                id: 5,
                category: "carlota",
                name: "Carlota de Fresa",
                desc: "Vaso grande",
                price: 175,
                img: "Carlota_Vaso_Grande_Fresa[1].jpg",
                qty: 0
            },
            {
                id: 6,
                category: "carlota",
                name: "Carlota de Chinola",
                desc: "Vaso grande",
                price: 175,
                img: "Carlota_Vaso_Grande_Chinola[1].jpg",
                qty: 0
            },
            {
                id: 7,
                category: "carlota",
                name: "Carlota de Limón",
                desc: "Vaso grande",
                price: 175,
                img: "Carlota_Vaso_Grande_Limon[1].jpg",
                qty: 0
            },
            {
                id: 8,
                category: "carlota",
                name: "Carlota de Oreo",
                desc: "Vaso grande",
                price: 175,
                img: "Carlota_Vaso_Grande_Oreo[1].jpg",
                qty: 0
            },

            // CHEESECAKES POR PORCIÓN: RD$200
            {
                id: 9,
                category: "cheesecake",
                name: "Cheesecake de Chinola",
                desc: "Porción individual",
                price: 200,
                img: "chinola[1].jpg",
                qty: 0
            },
            {
                id: 10,
                category: "cheesecake",
                name: "Cheesecake de Limón",
                desc: "Porción individual",
                price: 200,
                img: "limon[1].jpg",
                qty: 0
            },
            {
                id: 11,
                category: "cheesecake",
                name: "Cheesecake de Fresa",
                desc: "Porción individual",
                price: 200,
                img: "fresa[1].jpg",
                qty: 0
            },
            {
                id: 12,
                category: "cheesecake",
                name: "Cheesecake de Oreo",
                desc: "Porción individual",
                price: 200,
                img: "oreo[1].jpg",
                qty: 0
            },

            // CHEESECAKES GRANDES: RD$1,200
            {
                id: 13,
                category: "cheesecake",
                name: "Cheesecake de Chinola",
                desc: "Cheesecake entero grande",
                price: 1200,
                img: "chinola[1].jpg",
                qty: 0
            },
            {
                id: 14,
                category: "cheesecake",
                name: "Cheesecake de Limón",
                desc: "Cheesecake entero grande",
                price: 1200,
                img: "limon[1].jpg",
                qty: 0
            },
            {
                id: 15,
                category: "cheesecake",
                name: "Cheesecake de Fresa",
                desc: "Cheesecake entero grande",
                price: 1200,
                img: "fresa[1].jpg",
                qty: 0
            },
            {
                id: 16,
                category: "cheesecake",
                name: "Cheesecake de Oreo",
                desc: "Cheesecake entero grande",
                price: 1200,
                img: "oreo[1].jpg",
                qty: 0
            }
        ];

        const carlotaCatalog = document.getElementById("carlotaCatalog");
        const cheesecakeCatalog = document.getElementById("cheesecakeCatalog");
        const cartTotalEl = document.getElementById("cartTotal");
        const whatsappLinkEl = document.getElementById("whatsappLink");

        // Conserva el número de WhatsApp configurado en tu código.
        const phoneNumber = "18298173717";

        function money(amount) {
            return "RD$" + amount.toLocaleString("en-US");
        }

        function renderCatalog() {
            carlotaCatalog.innerHTML = "";
            cheesecakeCatalog.innerHTML = "";

            let total = 0;
            const messageList = [];

            products.forEach(product => {
                total += product.price * product.qty;

                if (product.qty > 0) {
                    messageList.push(
                        `- ${product.qty} x ${product.name} (${product.desc}) = ${money(product.price * product.qty)}`
                    );
                }

                const card = document.createElement("div");
                card.className = "product-card";

                card.innerHTML = `
                    <img
                        src="${product.img}"
                        alt="${product.name}"
                        class="product-img"
                        loading="lazy"
                    >

                    <div class="product-info">
                        <div class="product-name">${product.name}</div>
                        <div class="product-desc">${product.desc}</div>
                        <div class="product-price">${money(product.price)}</div>
                    </div>

                    <div class="counter">
                        <button
                            type="button"
                            aria-label="Quitar ${product.name}"
                            onclick="changeQty(${product.id}, -1)">−</button>

                        <span class="quantity">${product.qty}</span>

                        <button
                            type="button"
                            aria-label="Agregar ${product.name}"
                            onclick="changeQty(${product.id}, 1)">+</button>
                    </div>
                `;

                if (product.category === "carlota") {
                    carlotaCatalog.appendChild(card);
                } else {
                    cheesecakeCatalog.appendChild(card);
                }
            });

            cartTotalEl.textContent = "Total: " + money(total);

            if (messageList.length > 0) {
                const message =
                    "¡Hola! Me gustaría hacer un pedido en Leah's Sweet Corner:\n\n" +
                    messageList.join("\n") +
                    "\n\nTotal del pedido: " + money(total);

                whatsappLinkEl.href =
                    "https://wa.me/" + phoneNumber +
                    "?text=" + encodeURIComponent(message);

                whatsappLinkEl.style.pointerEvents = "auto";
                whatsappLinkEl.style.opacity = "1";
            } else {
                whatsappLinkEl.href = "#";
                whatsappLinkEl.style.pointerEvents = "none";
                whatsappLinkEl.style.opacity = "0.5";
            }
        }

        function changeQty(id, change) {
            const product = products.find(item => item.id === id);

            if (product) {
                product.qty = Math.max(0, product.qty + change);
                renderCatalog();
            }
        }

        renderCatalog();
    </script>

</body>
</html>
