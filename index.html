<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Leah's Sweet Corner | Pedidos por WhatsApp</title>
    <style>
        :root {
            --bg-color: #f0fdf4;        
            --card-bg: #ffffff;         
            --text-color: #065f46;      
            --text-muted: #047857;      
            --accent-color: #ec4899;    
            --accent-hover: #db2777;    
            --tag-bg: #fbcfe8;          
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            padding-bottom: 100px;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
        }

        .logo {
            width: 130px;
            height: 130px;
            border-radius: 50%;
            object-fit: cover;
            margin-bottom: 15px;
            box-shadow: 0 4px 15px rgba(6, 95, 70, 0.15);
            border: 3px solid #ffffff;
        }

        h1 {
            font-size: 2.3rem;
            margin-bottom: 5px;
            color: var(--text-color);
        }

        .subtitle {
            color: var(--text-muted);
            font-size: 1.1rem;
        }

        .catalog {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
            max-width: 1000px;
            margin: 0 auto 40px auto;
        }

        .product-card {
            background-color: var(--card-bg);
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 10px 25px rgba(236, 72, 153, 0.1);
            text-align: center;
            border: 1px solid #bbf7d0;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .product-img {
            width: 100%;
            height: 180px;
            object-fit: cover;
        }

        .product-info {
            padding: 15px;
        }

        .product-name {
            font-size: 1.2rem;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .product-desc {
            font-size: 0.9rem;
            color: #6b7280;
            margin-bottom: 10px;
        }

        .product-price {
            color: var(--accent-color);
            font-size: 1.1rem;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .counter {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px;
            margin-top: 10px;
            padding-bottom: 15px;
        }

        .counter button {
            background-color: var(--tag-bg);
            color: var(--accent-color);
            border: none;
            width: 30px;
            height: 30px;
            border-radius: 50%;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }

        .counter button:hover {
            background-color: var(--accent-color);
            color: white;
        }

        .quantity {
            font-size: 1.1rem;
            font-weight: bold;
            width: 20px;
            text-align: center;
        }

        .cart-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background-color: #ffffff;
            box-shadow: 0 -5px 20px rgba(0,0,0,0.1);
            padding: 15px 20px;
            display: flex;
            justify-content: space-around;
            align-items: center;
            box-sizing: border-box;
            border-top: 2px solid #bbf7d0;
            z-index: 100;
        }

        .cart-total {
            font-size: 1.2rem;
            font-weight: bold;
            color: var(--text-color);
        }

        .whatsapp-btn {
            background-color: #25d366;
            color: white;
            padding: 12px 24px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: bold;
            transition: background 0.2s;
            box-shadow: 0 4px 10px rgba(37, 211, 102, 0.3);
        }

        .whatsapp-btn:hover {
            background-color: #20ba5a;
        }
    </style>
</head>
<body>

    <header>
        <img src="image.jpg" alt="Leah's Sweet Corner Logo" class="logo">
        <h1>Leah's Sweet Corner</h1>
        <div class="subtitle">¡Postres hechos con amor! Elige tus favoritos y pídelos al WhatsApp.</div>
    </header>

    <div class="catalog" id="catalog"></div>

    <div class="cart-bar">
        <div class="cart-total" id="cartTotal">Total: $0.00</div>
        <a id="whatsappLink" href="#" target="_blank" class="whatsapp-btn">Pedir por WhatsApp 📱</a>
    </div>

    <script>
        const products = [
            { id: 1, name: "Carlota de Limón (Vaso Pequeño)", desc: "Cremosa con galletas María", price: 100.00, img: "https://images.unsplash.com/photo-1541781774459-bb2af2f05b55?auto=format&fit=crop&w=500&q=80", qty: 0 },
            { id: 2, name: "Carlota de Limón (Vaso Grande)", desc: "Formato individual más grande", price: 175.00, img: "https://images.unsplash.com/photo-1541781774459-bb2af2f05b55?auto=format&fit=crop&w=500&q=80", qty: 0 },
            { id: 3, name: "Carlota de Chinola (Vaso Pequeño)", desc: "Con toque tropical de chinola", price: 100.00, img: "https://images.unsplash.com/photo-1541781774459-bb2af2f05b55?auto=format&fit=crop&w=500&q=80", qty: 0 },
            { id: 4, name: "Carlota de Chinola (Vaso Grande)", desc: "Formato individual más grande", price: 175.00, img: "https://images.unsplash.com/photo-1541781774459-bb2af2f05b55?auto=format&fit=crop&w=500&q=80", qty: 0 },
            { id: 5, name: "Carlota de Fresa (Vaso Pequeño)", desc: "Delicia cremosa de fresa", price: 100.00, img: "https://images.unsplash.com/photo-1541781774459-bb2af2f05b55?auto=format&fit=crop&w=500&q=80", qty: 0 },
            { id: 6, name: "Carlota de Fresa (Vaso Grande)", desc: "Formato individual más grande", price: 175.00, img: "https://images.unsplash.com/photo-1541781774459-bb2af2f05b55?auto=format&fit=crop&w=500&q=80", qty: 0 },
            { id: 7, name: "Cheesecake de Limón (Grande)", desc: "Delicioso cheesecake completo", price: 1200.00, img: "https://images.unsplash.com/photo-1533134242443-d4fd215305ad?auto=format&fit=crop&w=500&q=80", qty: 0 },
            { id: 8, name: "Cheesecake de Chinola (Grande)", desc: "Delicioso cheesecake completo", price: 1200.00, img: "https://images.unsplash.com/photo-1533134242443-d4fd215305ad?auto=format&fit=crop&w=500&q=80", qty: 0 },
            { id: 9, name: "Cheesecake de Fresa (Grande)", desc: "Delicioso cheesecake completo", price: 1200.00, img: "https://images.unsplash.com/photo-1533134242443-d4fd215305ad?auto=format&fit=crop&w=500&q=80", qty: 0 },
            { id: 10, name: "Cheesecake de Oreo (Grande)", desc: "Delicioso cheesecake completo", price: 1200.00, img: "https://images.unsplash.com/photo-1533134242443-d4fd215305ad?auto=format&fit=crop&w=500&q=80", qty: 0 }
        ];

        const catalogEl = document.getElementById('catalog');
        const cartTotalEl = document.getElementById('cartTotal');
        const whatsappLinkEl = document.getElementById('whatsappLink');
        const phoneNumber = "18298173717"; 

        function renderCatalog() {
            catalogEl.innerHTML = '';
            let total = 0;
            let messageList = [];

            products.forEach(product => {
                total += product.price * product.qty;

                if (product.qty > 0) {
                    messageList.push(`- ${product.qty}x ${product.name} ($${(product.price * product.qty).toFixed(2)})`);
                }

                const card = document.createElement('div');
                card.className = 'product-card';
                card.innerHTML = `
                    <img src="${product.img}" alt="${product.name}" class="product-img">
                    <div class="product-info">
                        <div class="product-name">${product.name}</div>
                        <div class="product-desc">${product.desc}</div>
                        <div class="product-price">$${product.price.toFixed(2)}</div>
                    </div>
                    <div class="counter">
                        <button onclick="changeQty(${product.id}, -1)">-</button>
                        <span class="quantity">${product.qty}</span>
                        <button onclick="changeQty(${product.id}, 1)">+</button>
                    </div>
                `;
                catalogEl.appendChild(card);
            });

            cartTotalEl.textContent = `Total: $${total.toFixed(2)}`;

            if (messageList.length > 0) {
                let text = `¡Hola! Me gustaría hacer el siguiente pedido en Leah's Sweet Corner:\n\n` + messageList.join('\n') + `\n\n*Total a pagar: $${total.toFixed(2)}*`;
                let encodedText = encodeURIComponent(text);
                whatsappLinkEl.href = `https://wa.me/${phoneNumber}?text=${encodedText}`;
                whatsappLinkEl.style.pointerEvents = "auto";
                whatsappLinkEl.style.opacity = "1";
            } else {
                whatsappLinkEl.href = "#";
                whatsappLinkEl.style.pointerEvents = "none";
                whatsappLinkEl.style.opacity = "0.5";
            }
        }

        function changeQty(id, change) {
            const product = products.find(p => p.id === id);
            if (product) {
                product.qty += change;
                if (product.qty < 0) product.qty = 0;
                renderCatalog();
            }
        }

        renderCatalog();
    </script>
</body>
</html>
